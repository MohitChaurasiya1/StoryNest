services:
  # Django API Backend
  - type: web
    name: storynest-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile.prod
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://storynest-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://storynest-frontend.onrender.com,https://storynest-backend.onrender.com"
      # Superuser auto-creation on first deploy
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@storynest.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false   # Set this manually in Render dashboard
      # Database (Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: storynest-db
          property: connectionString

  # React Frontend (Nginx Docker Service)
  - type: web
    name: storynest-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: Dockerfile.prod
    envVars:
      - key: VITE_API_URL
        value: https://storynest-backend.onrender.com

databases:
  - name: storynest-db
    plan: free
