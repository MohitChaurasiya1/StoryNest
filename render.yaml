services:
  # Django API Backend
  - type: web
    name: storynest-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile.prod
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: storynest-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: storynest-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: storynest-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: storynest-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: storynest-db
          property: port
      - key: ALLOWED_HOSTS
        value: "*"

  # React Frontend (Nginx Docker Service)
  - type: web
    name: storynest-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: Dockerfile.prod
    envVars:
      - key: VITE_API_URL
        value: https://storynest-backend.onrender.com # Adjust if custom domain is used

databases:
  - name: storynest-db
    plan: free
